<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognivision — Gateway Test Client</title>
<style>
  :root {
    --bg: #12130f;
    --panel: #1a1c16;
    --line: #33362b;
    --text: #e9e8de;
    --muted: #8d9080;
    --accent: #9fc131;
    --danger: #d6644b;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  body {
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 0 0 4px;
  }
  h1 span { color: var(--accent); }
  p.sub {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 13px;
  }
  .field {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-family: var(--sans);
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .drop {
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }
  .drop.has-image {
    padding: 0;
    border-style: solid;
    overflow: hidden;
  }
  .drop img {
    display: block;
    width: 100%;
    max-height: 340px;
    object-fit: contain;
    background: #0a0b08;
  }
  input[type="file"] { display: none; }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #14170c;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    background: var(--line);
    color: var(--muted);
    cursor: not-allowed;
  }
  .status {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--accent); }
  .result {
    margin-top: 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    display: none;
  }
  .result.show { display: block; }
  .result-img {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    background: #0a0b08;
    border-radius: 6px;
    margin-bottom: 16px;
    display: block;
  }
  .result-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin: 0 0 12px;
  }
  .summary {
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 12px;
  }
  .detail {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
  }
  .replay {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    width: auto;
    margin-top: 16px;
    padding: 8px 14px;
    font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <h1>cognivision <span>// gateway test client</span></h1>
  <p class="sub">Connects to <code>ws://localhost:8080/gateway</code>, sends an image + prompt, speaks the result.</p>

  <div class="field">
    <label for="addr">Gateway address</label>
    <input type="text" id="addr" value="ws://localhost:8080/gateway">
  </div>

  <div class="field">
    <label for="prompt">Prompt</label>
    <input type="text" id="prompt" value="What is in front of me?">
  </div>

  <div class="field">
    <label>Image</label>
    <div class="drop" id="drop">
      <span id="dropLabel">Click to choose an image</span>
      <img id="preview" hidden>
    </div>
    <input type="file" id="file" accept="image/*">
  </div>

  <button id="send" disabled>Choose an image first</button>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <img class="result-img" id="resultImg" alt="submitted image">
    <p class="result-label">result</p>
    <p class="summary" id="summary"></p>
    <p class="detail" id="detail"></p>
    <p class="meta" id="meta"></p>
    <button class="replay" id="replay">🔊 Replay summary</button>
  </div>
</main>

<script>
  const els = {
    addr: document.getElementById("addr"),
    prompt: document.getElementById("prompt"),
    drop: document.getElementById("drop"),
    dropLabel: document.getElementById("dropLabel"),
    file: document.getElementById("file"),
    preview: document.getElementById("preview"),
    send: document.getElementById("send"),
    status: document.getElementById("status"),
    result: document.getElementById("result"),
    resultImg: document.getElementById("resultImg"),
    summary: document.getElementById("summary"),
    detail: document.getElementById("detail"),
    meta: document.getElementById("meta"),
    replay: document.getElementById("replay"),
  };

  let socket = null;
  let selectedImageB64 = null; // raw base64, no data: prefix -- what the gateway expects
  let lastSummary = "";

  // -- image selection ------------------------------------------------

  els.drop.addEventListener("click", () => els.file.click());

  els.file.addEventListener("change", () => {
    const f = els.file.files[0];
    if (!f) return;

    const reader = new FileReader();
    reader.onload = () => {
      // reader.result is "data:image/jpeg;base64,AAAA..." -- the gateway
      // wants just the base64 payload (Go's json package base64-decodes
      // a []byte field on its own, it doesn't expect a data: URI).
      const dataUrl = reader.result;
      selectedImageB64 = dataUrl.split(",")[1];

      els.preview.src = dataUrl;
      els.preview.hidden = false;
      els.dropLabel.hidden = true;
      els.drop.classList.add("has-image");

      els.send.disabled = false;
      els.send.textContent = "Send";
    };
    reader.readAsDataURL(f);
  });

  // -- websocket --------------------------------------------------------

  function setStatus(text, kind) {
    els.status.textContent = text;
    els.status.className = "status" + (kind ? " " + kind : "");
  }

  function connect() {
    return new Promise((resolve, reject) => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        resolve();
        return;
      }

      setStatus("connecting to " + els.addr.value + " ...");
      socket = new WebSocket(els.addr.value);

      socket.addEventListener("open", () => {
        setStatus("connected", "ok");
        resolve();
      });

      socket.addEventListener("message", (event) => {
        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          setStatus("received a non-JSON message, ignoring", "err");
          return;
        }
        showResult(payload);
      });

      socket.addEventListener("close", () => {
        setStatus("connection closed");
      });

      socket.addEventListener("error", () => {
        setStatus("websocket error -- is the gateway running?", "err");
        reject(new Error("websocket error"));
      });
    });
  }

  async function send() {
    if (!selectedImageB64) return;

    els.send.disabled = true;
    els.send.textContent = "Sending...";
    els.result.classList.remove("show");

    try {
      await connect();
    } catch {
      els.send.disabled = false;
      els.send.textContent = "Send";
      return;
    }

    const request = {
      prompt: els.prompt.value,
      img: selectedImageB64,
    };

    socket.send(JSON.stringify(request));
    setStatus("sent, waiting for a result...");
  }

  function showResult(result) {
    // Matches types.Result on the Go side: {id, summary, img, inference, time, date}.
    lastSummary = result.summary || "";

    if (result.img) {
      els.resultImg.src = "data:image/jpeg;base64," + result.img;
      els.resultImg.hidden = false;
    }

    els.summary.textContent = result.summary || "(no summary)";

    // The worker's "inference" field may be a plain string or a JSON
    // string (depends on what your model outputs) -- try to parse it for
    // nicer display, fall back to the raw text.
    let detailText = result.inference || "";
    try {
      const parsed = JSON.parse(detailText);
      detailText = JSON.stringify(parsed, null, 2);
    } catch {
      // not JSON, use as-is
    }
    els.detail.textContent = detailText;
    els.meta.textContent = [result.date, result.id].filter(Boolean).join("  ·  ");
    els.result.classList.add("show");

    setStatus("result received", "ok");
    els.send.disabled = false;
    els.send.textContent = "Send another";

    speak(lastSummary);
  }

  // -- speech -----------------------------------------------------------

  function speak(text) {
    if (!text || !("speechSynthesis" in window)) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    utterance.rate = 1;
    utterance.pitch = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }

  els.send.addEventListener("click", send);
  els.replay.addEventListener("click", () => speak(lastSummary));

  window.addEventListener("beforeunload", () => {
    if (socket) socket.close(1000, "page closed");
  });
</script>
</body>
</html>
