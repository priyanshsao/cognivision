syntax = "proto3";

package proto;

option go_package = "github.com/cognivision/gateway/proto";

// Result represents the structure of final reply given to user/client.
message Result {
  // id contains request id.
  string          id        = 1;
  // reply contains text reply/instructions for prompt.
  string          reply     = 5;
  // inference contains the results generated by models.
  Inference       inference = 2;
  // time contains the time stamp when this message is generated.
  string          time      = 3;
  // date contains the date stamp when this message is generated.
  string          date      = 4;
}

// ClientRequest defines the structure of a client's request.
message ClientRequest {
  // img contains the snapshot of camera, when user generates a prompt.
  bytes  img    = 1;
  // prompt is the query/question generated by user related to the img.
  string prompt = 2;
}

// RedisRequest defines the structure of message for processing requests.
message RedisRequest {
  // id contains request id.
  string id     = 1;
  // Todo: Remove this in future because passing this is of no use just repetitive.
  // prompt is the query/question generated by user related to the img.
  string prompt = 2;
}

// InferenceResult defines the structure of result from inference.
message InferenceResult {
  // id contains request id.
  string    id        = 1;
  // Todo: Remove this in future because passing this, is of no use it's just repetitive.
  // prompt is the query/question generated by user related to the img.
  string    prompt    = 2;
  // inference contains the results generated by models.
  Inference inference = 3;
}

// Inference defines structure for image results with more detailed information.
message Inference {
  // img is the updated img with detected objects/segementation shown using opencv.
  // this is generated by model.
  bytes      img        = 1;
  // detections is the list of data generated by models,
  // for example: [objectdetection, depth, segementation] etc.
  Detections detections = 2;
}

// Detections contains all the detections from all the available models.
message Detections {
  // object contains object detections.
  repeated ObjectDetectionData object = 1;
}

// ObjectDetectionData defines the structure of detections from YOLO for objects.
message ObjectDetectionData {
  // label is the label of the object.
  // Ex: person, dog, cat, traffic light etc.
  string         label = 1;
  // bbox contains coordinates of box that encloses the object tightly.
  repeated int32 bbox  = 2;
}